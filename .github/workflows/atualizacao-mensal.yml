name: Atualização mensal dos indicadores
on:
  schedule:
    - cron: '17 9 15 * *'
  workflow_dispatch:
permissions:
  contents: write
concurrency:
  group: atualizacao-indicadores
  cancel-in-progress: false
jobs:
  atualizar:
    runs-on: ubuntu-latest
    timeout-minutes: 330
    env:
      TCC_ETL_RAIZ: ${{ github.workspace }}/var/etl
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ github.event.repository.default_branch }}
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
          cache: pip
          cache-dependency-path: requirements-lock.txt
      - run: python -m pip install -r requirements-lock.txt
      - name: Validar código e dados existentes
        run: |
          python -m pytest tests -q
          python -m etl.validar
      - name: Extrair e validar todas as camadas
        run: python atualizar.py --avaliar --publicar-local
      - name: Registrar dados validados
        run: |
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add dados/
          if ! git diff --cached --quiet; then
            git commit -m 'Atualiza indicadores após validação mensal'
            git push
          fi
      - name: Guardar diagnóstico da execução
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: auditoria-${{ github.run_id }}
          path: |
            var/etl/ultima_execucao.json
            var/etl/lotes/*/execucao.json
            var/etl/lotes/*/monitoramento/
            var/etl/lotes/*/dados/
            var/etl/evidencias/
            var/etl/populacao_bruta/
            var/etl/geografia/meta.json
            experimentos/monitoramento.py
            dominio/monitoramento.py
            dominio/dados.py
            configuracao.py
            etl/definicao_cid.py
            config.toml
            requirements-lock.txt
            var/etl/exportacoes/*/manifesto.json
          if-no-files-found: ignore
          retention-days: 90
